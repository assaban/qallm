<!--
  Complete QALLM Pipeline Diagram
  Source: verification-architecture.md
  Usage: Thesis Figure (Chapter 4: Implementation), README
  Shows all three operations: analyse, repair, verify
-->
<svg width="680" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, Helvetica, sans-serif; background: white;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Stage 1: Input -->
  <text x="40" y="30" font-weight="500" font-size="14" fill="#444">Stage 1: Input</text>
  <rect x="40" y="40" width="600" height="60" rx="12" fill="#F1EFE8" fill-opacity="0.4" stroke="#888" stroke-width="0.5"/>
  <rect x="56" y="50" width="120" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="116" y="72" text-anchor="middle" font-size="12" fill="#444">.ipynb notebook</text>
  <rect x="192" y="50" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="242" y="72" text-anchor="middle" font-size="12" fill="#444">.py file / dir</text>
  <rect x="308" y="50" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="358" y="72" text-anchor="middle" font-size="12" fill="#444">.zip archive</text>
  <rect x="424" y="50" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="474" y="72" text-anchor="middle" font-size="12" fill="#444">GitHub URL</text>
  <text x="560" y="72" font-size="12" fill="#999">adapters/</text>

  <!-- Arrow to workspace -->
  <line x1="340" y1="100" x2="340" y2="124" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Session workspace -->
  <rect x="200" y="126" width="280" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#444">Session workspace (.py files)</text>

  <!-- Arrow to operations -->
  <line x1="340" y1="162" x2="340" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Operations -->
  <text x="40" y="208" font-weight="500" font-size="14" fill="#444">Stage 2: Operations (user chooses any combination)</text>

  <!-- Analyse -->
  <rect x="40" y="220" width="180" height="140" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="130" y="242" text-anchor="middle" font-weight="500" font-size="14" fill="#444">Analyse</text>
  <text x="130" y="258" text-anchor="middle" font-size="12" fill="#888">analysis/</text>
  <rect x="56" y="268" width="70" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="91" y="286" text-anchor="middle" font-size="12" fill="#444">Bandit</text>
  <rect x="134" y="268" width="70" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="169" y="286" text-anchor="middle" font-size="12" fill="#444">Radon</text>
  <rect x="56" y="304" width="70" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="91" y="322" text-anchor="middle" font-size="12" fill="#444">Ruff</text>
  <rect x="134" y="304" width="70" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="169" y="322" text-anchor="middle" font-size="12" fill="#444">TruffleHog</text>

  <!-- Repair -->
  <rect x="250" y="220" width="180" height="140" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="340" y="242" text-anchor="middle" font-weight="500" font-size="14" fill="#444">Repair</text>
  <text x="340" y="258" text-anchor="middle" font-size="12" fill="#888">repair/</text>
  <rect x="270" y="272" width="140" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="290" text-anchor="middle" font-size="12" fill="#444">LLM code fix</text>
  <rect x="270" y="308" width="140" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="326" text-anchor="middle" font-size="12" fill="#444">Batch per file</text>

  <!-- Verify (thesis core) -->
  <rect x="460" y="220" width="180" height="140" rx="12" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="550" y="242" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Verify</text>
  <text x="550" y="258" text-anchor="middle" font-size="12" fill="#0F6E56">verification/</text>
  <rect x="476" y="272" width="148" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="290" text-anchor="middle" font-size="12" fill="#085041">RL test generation</text>
  <rect x="476" y="308" width="148" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="326" text-anchor="middle" font-size="12" fill="#085041">5 to 10 round loop</text>

  <!-- Arrows to report -->
  <line x1="130" y1="360" x2="130" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="360" x2="340" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="360" x2="550" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Report -->
  <text x="40" y="418" font-weight="500" font-size="14" fill="#444">Stage 3: Quality report</text>
  <rect x="40" y="428" width="600" height="80" rx="12" fill="#EEEDFE" fill-opacity="0.3" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="56" y="440" width="140" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="126" y="459" text-anchor="middle" font-size="12" fill="#3C3489">Static findings</text>
  <rect x="210" y="440" width="120" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="270" y="459" text-anchor="middle" font-size="12" fill="#3C3489">Repair patches</text>
  <rect x="344" y="440" width="140" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="414" y="459" text-anchor="middle" font-size="12" fill="#3C3489">Verification results</text>
  <rect x="498" y="440" width="130" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="563" y="459" text-anchor="middle" font-size="12" fill="#3C3489">Learning curve</text>
  <text x="340" y="496" text-anchor="middle" font-size="12" fill="#999">JSON output compatible with Volentir et al. metrics framework</text>
</svg>
