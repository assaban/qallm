<!--
  Reward Function Components Diagram
  Source: T-016 design documentation
  Usage: Thesis Figure (Chapter 3/4)
  Shows how ExecutionResult metrics flow into four reward components
-->
<svg width="680" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, Helvetica, sans-serif; background: white;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Input: ExecutionResult -->
  <rect x="40" y="40" width="160" height="130" rx="12" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="120" y="62" text-anchor="middle" font-weight="500" font-size="14" fill="#444">ExecutionResult</text>
  <text x="56" y="86" font-size="12" fill="#555">passed: 3</text>
  <text x="56" y="104" font-size="12" fill="#555">failed: 1</text>
  <text x="56" y="122" font-size="12" fill="#555">errors: 0</text>
  <text x="56" y="140" font-size="12" fill="#555">coverage: 70%</text>
  <text x="56" y="158" font-size="12" fill="#555">prev. best: 50%</text>

  <!-- Arrows to components -->
  <line x1="200" y1="86" x2="248" y2="86" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="120" x2="248" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="140" x2="248" y2="254" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bug reward -->
  <rect x="250" y="60" width="200" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="350" y="78" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#27500A">Bug discovery</text>
  <text x="350" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">1 failed × +1.0 = +1.0</text>

  <!-- Coverage reward -->
  <rect x="250" y="144" width="200" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="350" y="162" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#27500A">Coverage gain</text>
  <text x="350" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">20% new × +0.5 = +10.0</text>

  <!-- Validity penalty -->
  <rect x="250" y="228" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="350" y="246" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#444">Validity penalty</text>
  <text x="350" y="264" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">0 errors × −0.5 = 0.0</text>

  <!-- Redundancy penalty -->
  <rect x="250" y="312" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="350" y="330" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#444">Redundancy penalty</text>
  <text x="350" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">0 redundant × −0.2 = 0.0</text>

  <!-- Arrows to total -->
  <line x1="450" y1="85" x2="518" y2="175" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="169" x2="518" y2="185" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="253" x2="518" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="337" x2="518" y2="205" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Total score -->
  <rect x="520" y="160" width="130" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="585" y="182" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#3C3489">Total reward</text>
  <text x="585" y="206" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="16" fill="#3C3489">+11.0</text>

  <!-- Note -->
  <text x="340" y="390" text-anchor="middle" font-size="12" fill="#999">Coverage gain = max(0, current 70% − previous best 50%) = 20 percentage points</text>
</svg>
