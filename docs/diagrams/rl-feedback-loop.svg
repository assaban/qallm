<!--
  RL Feedback Loop Diagram
  Source: T-016/T-017 design documentation
  Usage: Thesis Figure (Chapter 3/4), supervisor presentations
  Maps to: Thesis proposal Figure 2
-->
<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, Helvetica, sans-serif; background: white;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: Generate -->
  <rect x="220" y="40" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#085041">1. LLM generates tests</text>
  <text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">generator.py + prompts.py</text>

  <!-- Arrow down -->
  <line x1="340" y1="96" x2="340" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Execute -->
  <rect x="220" y="132" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#085041">2. Execute tests</text>
  <text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">executor.py (subprocess pytest)</text>

  <!-- Arrow down -->
  <line x1="340" y1="188" x2="340" y2="222" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Measure coverage -->
  <rect x="220" y="224" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#085041">3. Measure coverage</text>
  <text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">coverage.py (branch=True)</text>

  <!-- Arrow down -->
  <line x1="340" y1="280" x2="340" y2="314" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Score -->
  <rect x="220" y="316" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#3C3489">4. Score tests</text>
  <text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">reward.py (compute_reward)</text>

  <!-- Arrow down -->
  <line x1="340" y1="372" x2="340" y2="406" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Build feedback -->
  <rect x="220" y="408" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="428" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#3C3489">5. Build feedback prompt</text>
  <text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">prompts.py (build_feedback)</text>

  <!-- Feedback loop arrow -->
  <path d="M220 436 L120 436 L120 68 L218 68" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop label -->
  <text x="80" y="254" text-anchor="middle" font-size="12" fill="#534AB7">iterate</text>
  <text x="80" y="270" text-anchor="middle" font-size="12" fill="#534AB7">5 to 10</text>
  <text x="80" y="286" text-anchor="middle" font-size="12" fill="#534AB7">rounds</text>

  <!-- Reward sidebar -->
  <rect x="490" y="300" width="160" height="180" rx="8" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="570" y="322" text-anchor="middle" dominant-baseline="central" font-weight="500" font-size="14" fill="#444">Reward signal</text>
  <text x="505" y="350" font-size="12" fill="#555">+1.0 bug found</text>
  <text x="505" y="370" font-size="12" fill="#555">+0.5 new coverage pt</text>
  <text x="505" y="390" font-size="12" fill="#555"> 0.0 trivial test</text>
  <text x="505" y="410" font-size="12" fill="#555">−0.5 invalid test</text>
  <text x="505" y="430" font-size="12" fill="#555">−0.2 redundant test</text>
  <text x="505" y="460" font-size="12" fill="#555">Total: scalar reward</text>

  <!-- Arrow from reward sidebar to score box -->
  <line x1="490" y1="344" x2="462" y2="344" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Round annotations -->
  <text x="480" y="68" font-size="12" fill="#999">Round 1: oracle prompt</text>
  <text x="480" y="84" font-size="12" fill="#999">Round 2+: feedback prompt</text>
  <text x="480" y="195" font-size="12" fill="#999">Early stop if coverage</text>
  <text x="480" y="211" font-size="12" fill="#999">= 100% and bugs found</text>
</svg>
